name: keel

services:
  keel:
    image: ghcr.io/elcarom/psychic-octo-funicular:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keel
    restart: unless-stopped
    environment:
      - PUID=99
      - PGID=100
      - UMASK=022
      - PORT=8080
      - DATA_DIR=/data
      - BACKUPS_DIR=/backups
      - LOG_LEVEL=info
      - KEEL_MASTER_KEY=${KEEL_MASTER_KEY:?KEEL_MASTER_KEY must be set (min 32 characters)}
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/keel/data:/data
      - /mnt/user/appdata/keel/backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
