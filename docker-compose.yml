name: keel

# Keel: one container serving the dashboard and API.
# Put KEEL_MASTER_KEY (and anything else you change) in a .env file beside this one:
#   KEEL_MASTER_KEY=<openssl rand -base64 48>
#   KEEL_PORT=8080
services:
  keel:
    image: ghcr.io/elcarom/keel:latest
    container_name: keel
    restart: unless-stopped
    environment:
      - PUID=99
      - PGID=100
      - UMASK=022
      - PORT=8080
      - DATA_DIR=/data
      - BACKUPS_DIR=/backups
      - LOG_LEVEL=info
      - KEEL_MASTER_KEY=${KEEL_MASTER_KEY:?KEEL_MASTER_KEY must be set (generate with openssl rand -base64 48)}
      # Sign in over plain http://<server-ip>:<port> on your LAN. HTTPS requests (e.g. through a
      # Cloudflare Tunnel) still get Secure cookies. Set false if Keel is only reached over HTTPS.
      - KEEL_ALLOW_INSECURE_HTTP=${KEEL_ALLOW_INSECURE_HTTP:-true}
      # Fetch new hourly bars and step the Fleet; without it boats never trade
      - KEEL_ENABLE_SCHEDULER=${KEEL_ENABLE_SCHEDULER:-true}
      # Optional: lets Claude design boats. You can store it in the Engine Room vault instead.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional: your Claude subscription, from `claude setup-token`, so the night shift can
      # research new boats without an API key. You can store it in the vault instead.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      # Host port on the left: change KEEL_PORT if 8080 is taken
      - "${KEEL_PORT:-8080}:8080"
    volumes:
      - /mnt/user/appdata/keel/data:/data
      - /mnt/user/appdata/keel/backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
